name: MA-TV Web Beta

on:
  push:
    branches: [ main, parity-rebuild-1 ]
  workflow_dispatch:

concurrency:
  group: ma-tv-web-beta
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy-web:
    name: Build Web & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true


      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze lib test/playback_engines_test.dart

      - name: Run Tests
        run: flutter test test/playback_engines_test.dart

      - name: Build Web Application
        run: flutter build web --release --target lib/web_probe.dart --base-href "/ma-tv-flutter/"

      - name: Browser Smoke Test
        run: |
          mkdir -p /tmp/matv-site/ma-tv-flutter
          cp -R build/web/. /tmp/matv-site/ma-tv-flutter/
          python3 -m http.server 8080 --directory /tmp/matv-site >/tmp/matv-http.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --virtual-time-budget=15000 --screenshot=web-smoke.png http://127.0.0.1:8080/ma-tv-flutter/
          test -s web-smoke.png

      - name: Upload Browser Smoke Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          retention-days: 3

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

