name: MA-TV Web Beta

on:
  push:
    branches: [ main, parity-rebuild-1 ]
  workflow_dispatch:

concurrency:
  group: ma-tv-web-beta
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy-web:
    name: Build Web & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true


      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze lib test/playback_engines_test.dart

      - name: Run Tests
        run: flutter test test/playback_engines_test.dart

      - name: Build Web Application
        run: flutter build web --release --target lib/web_probe.dart --base-href "/ma-tv-flutter/"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

