name: MA-TV Web Beta

on:
  push:
    branches: [ main, parity-rebuild-1 ]
  workflow_dispatch:

concurrency:
  group: ma-tv-web-beta
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy-web:
    name: Build Web & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true


      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze lib test/playback_engines_test.dart

      - name: Run Tests
        run: flutter test test/playback_engines_test.dart

      - name: Build Web Application
        run: flutter build web --release --target lib/main.dart --base-href "/ma-tv-flutter/"

      - name: Cache Bust Flutter Web Assets
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          build_id = os.environ["BUILD_ID"]
          index = Path("build/web/index.html")
          bootstrap = Path("build/web/flutter_bootstrap.js")
          index_text = index.read_text()
          index_text = index_text.replace('flutter_bootstrap.js"', f'flutter_bootstrap.js?v={build_id}"')
          index.write_text(index_text)
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace('"mainJsPath":"main.dart.js"', f'"mainJsPath":"main.dart.js?v={build_id}"')
          bootstrap.write_text(bootstrap_text)
          PY

      - name: Browser Smoke Test
        run: |
          mkdir -p /tmp/matv-site/ma-tv-flutter
          cp -R build/web/. /tmp/matv-site/ma-tv-flutter/
          python3 -m http.server 8080 --directory /tmp/matv-site >/tmp/matv-http.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --virtual-time-budget=15000 --screenshot=web-smoke.png http://127.0.0.1:8080/ma-tv-flutter/
          test -s web-smoke.png

      - name: Upload Browser Smoke Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          retention-days: 3

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

      - name: Trigger GitHub Pages Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: Wait for Public GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          owner_repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{owner_repo}/pages/builds/latest"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          for attempt in range(36):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)
              status = data.get("status")
              print(f"Pages status: {status} (attempt {attempt + 1}/36)")
              if status == "built":
                  break
              if status == "errored":
                  raise SystemExit("GitHub Pages build failed")
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for GitHub Pages")
          PY

      - name: Verify Public GitHub Pages
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --virtual-time-budget=15000 \
            --screenshot=pages-live-smoke.png \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?ci=${{ github.sha }}"
          test -s pages-live-smoke.png

      - name: Upload Public Pages Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-smoke
          path: pages-live-smoke.png
          retention-days: 3

