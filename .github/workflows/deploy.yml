name: MA-TV Web Beta

on:
  push:
    branches: [ main, parity-rebuild-1, web-performance-next, integration/full-platform-ci, fix/runtime-safari-playback ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy-web:
    name: Build Web & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true


      - name: Install Dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze lib test/playback_engines_test.dart

      - name: Run Tests
        run: flutter test test/playback_engines_test.dart

      - name: Build Web Application
        timeout-minutes: 15
        run: flutter build web --release --target lib/main.dart --base-href "/ma-tv-flutter/" --tree-shake-icons --no-pub

      - name: Cache Bust Flutter Web Assets
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          build_id = os.environ["BUILD_ID"]
          index = Path("build/web/index.html")
          bootstrap = Path("build/web/flutter_bootstrap.js")
          index_text = index.read_text()
          index_text = index_text.replace('flutter_bootstrap.js"', f'flutter_bootstrap.js?v={build_id}"')
          index.write_text(index_text)
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace('"mainJsPath":"main.dart.js"', f'"mainJsPath":"main.dart.js?v={build_id}"')
          bootstrap.write_text(bootstrap_text)
          Path("build/web/deploy-version.txt").write_text(build_id + "\n")
          PY

      - name: Browser Smoke Test
        run: |
          mkdir -p /tmp/matv-site/ma-tv-flutter
          cp -R build/web/. /tmp/matv-site/ma-tv-flutter/
          python3 -m http.server 8080 --directory /tmp/matv-site >/tmp/matv-http.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --virtual-time-budget=15000 --screenshot=web-smoke.png http://127.0.0.1:8080/ma-tv-flutter/
          test -s web-smoke.png

      - name: Upload Browser Smoke Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          retention-days: 3

      - name: Deploy to GitHub Pages (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

      - name: Trigger GitHub Pages Build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: Wait for Public GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          owner_repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          owner, repo = owner_repo.split("/", 1)
          marker = f"https://{owner}.github.io/{repo}/deploy-version.txt?run={os.environ['GITHUB_RUN_ID']}"
          for attempt in range(48):
              try:
                  req = urllib.request.Request(marker, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      deployed = response.read().decode().strip()
                  print(f"Public marker: {deployed} (attempt {attempt + 1}/48)")
                  if deployed == os.environ["EXPECTED_SHA"]:
                      break
              except Exception as exc:
                  print(f"Waiting for public marker: {exc}")
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for exact deployed commit")
          PY

      - name: Verify Public GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --virtual-time-budget=15000 \
            --screenshot=pages-live-smoke.png \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?ci=${{ github.sha }}"
          test -s pages-live-smoke.png

      - name: Upload Public Pages Screenshot
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-smoke
          path: pages-live-smoke.png
          retention-days: 3



  build-android:
    name: Build Android Phone & TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
      - name: Regenerate Android Platform
        run: flutter create --platforms=android --org com.matv --project-name matv_flutter .
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MA-TV-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
      - name: Regenerate iOS Platform
        run: flutter create --platforms=ios --org com.matv --project-name matv_flutter .
      - name: Install Dependencies
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r MA-TV-Unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MA-TV-Release-IPA
          path: build/ios/iphoneos/MA-TV-Unsigned.ipa
