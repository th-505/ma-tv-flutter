<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MA-TV Cinematic Gold - تطبيق المشاهدة الترفيهية والبث المباشر فائق الجودة">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MA-TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MA-TV Cinematic Gold</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0A0B;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body>
  <div id="boot-error" style="display:none;position:fixed;inset:0;padding:32px;background:#0A0A0B;color:#fff;font-family:Arial,sans-serif;direction:rtl;z-index:9999">
    <h2 style="color:#D4AF37">تعذر تشغيل MA-TV</h2>
    <p id="boot-error-message">حدث خطأ أثناء تشغيل Flutter Web.</p>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      var box = document.getElementById('boot-error');
      var msg = document.getElementById('boot-error-message');
      if (box && msg) {
        msg.textContent = event.message || 'JavaScript startup error';
        box.style.display = 'block';
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      var box = document.getElementById('boot-error');
      var msg = document.getElementById('boot-error-message');
      if (box && msg) {
        msg.textContent = String(event.reason || 'Flutter startup promise rejected');
        box.style.display = 'block';
      }
    });
  </script>
  <script>
    (async function () {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        } catch (_) {}
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=sw-free-1';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
