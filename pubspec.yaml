name: matv_flutter
description: "MA-TV Cinematic Gold - Full-Stack Cross-Platform Streaming App for Web, Android Phone, Android TV, and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2

  # Networking & HTTP
  http: ^1.2.1
  cached_network_image: ^3.4.1

  # Video Playback (Web, Android, iOS, Android TV)
  video_player: ^2.8.5
  
  # Persistence & Storage
  shared_preferences: ^2.2.3

  # Localization & RTL
  intl: ^0.20.3

  # Native Device Utilities
  url_launcher: ^6.2.5
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
