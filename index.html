<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/ma-tv-flutter/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MA-TV">
  <title>MA-TV</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0A0A0B; }
    #boot-status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #D4AF37; font: 700 20px Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="boot-status">MA-TV: loading Flutter engine…</div>
  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('boot-status');
      if (el) el.textContent = 'MA-TV JS ERROR: ' + (e.message || 'unknown');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var el = document.getElementById('boot-status');
      if (el) el.textContent = 'MA-TV PROMISE ERROR: ' + String(e.reason || 'unknown');
    });
  </script>
  <script src="flutter_bootstrap.js?v=e6c46170c3c5008403d24b8035dd6dbce45a1354" async></script>
</body>
</html>
